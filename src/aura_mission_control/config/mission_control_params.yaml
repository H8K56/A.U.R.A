# ─────────────────────────────────────────────────
# A.U.R.A. Mission Control Configuration
# ─────────────────────────────────────────────────
#
# Global namespace (/**:) so parameters can be read
# by mission_control_node and any other node that
# needs mission-level settings.

/**:
  ros__parameters:

    # ── Node settings ─────────────────────────────
    tick_rate_hz: 2.0                   # State machine evaluation rate
    status_publish_rate_hz: 1.0         # MissionStatus publish rate
    auto_start: false                   # Auto-start mission on node launch
    num_drones: 5                       # Expected swarm size

    # ── Preflight ─────────────────────────────────
    min_battery_for_launch: 50.0        # Minimum battery % to begin
    preflight_timeout_sec: 120.0        # Abort if preflight exceeds this

    # ── Takeoff ───────────────────────────────────
    takeoff_altitude_m: 15.0            # Target takeoff altitude (m)
    takeoff_altitude_tolerance_m: 2.0   # Close-enough threshold (m)
    takeoff_timeout_sec: 60.0

    # ── Transit ───────────────────────────────────
    deploy_zone_x: 0.0                  # Deploy zone center X (ENU, m)
    deploy_zone_y: 0.0                  # Deploy zone center Y (ENU, m)
    deploy_zone_radius_m: 30.0          # Arrival threshold (m)
    transit_timeout_sec: 180.0

    # ── Formation ─────────────────────────────────
    formation_convergence_threshold: 5.0  # Max spread std dev (m)
    formation_timeout_sec: 120.0
    require_mesh_for_ops: true           # Must have mesh before OPERATIONS

    # ── Operations ────────────────────────────────
    operations_duration_sec: 600.0       # Mission duration (0 = unlimited)
    coverage_target: 80.0               # Target coverage %

    # ── Safety ────────────────────────────────────
    critical_battery_percent: 20.0       # Trigger RTL below this
    lost_drone_timeout_sec: 10.0         # Heartbeat timeout (s)
    max_drones_lost_before_abort: 2      # Abort if this many lost
