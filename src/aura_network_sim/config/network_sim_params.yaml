# ============================================================
# A.U.R.A. Network Simulation Configuration
# ============================================================

# ------------------------------------------------------------
# Global parameters shared by multiple nodes
# ------------------------------------------------------------
/**:
  ros__parameters:
    # Radio model
    tx_power_dbm: 20.0
    noise_floor_dbm: -100.0
    path_loss_exponent: 2.7
    reference_distance_m: 1.0

    # Mesh network limits
    max_mesh_distance_m: 150.0
    min_snr_db: 10.0

    # Log-normal shadowing. signal_noise_std_db is sigma in dB: measured
    # values are roughly 2-4 dB near-free-space air-to-air, 4-8 dB
    # air-to-ground over suburban terrain, 8-12 dB in dense urban canyons.
    # The D2G config adds 1 dB on top of this.
    signal_noise_std_db: 2.0
    # Distance over which shadowing decays to 1/e. Shadowing comes from
    # terrain and buildings, so nearby points are obstructed alike; an
    # independent draw per grid cell would be receiver noise, and it averages
    # out of the coverage figure instead of changing it.
    shadow_correlation_distance_m: 25.0
    # Correlation between two drones' shadowing to the same ground point
    # (3GPP inter-site value). Sets the sign of the effect: independent
    # paths give a diversity gain and raise coverage, shared shadowing
    # lowers it.
    shadow_inter_link_correlation: 0.5
    # false gives the deterministic median channel.
    shadowing_enabled: true
    # Seeds the shadowing realization so a run reproduces.
    random_seed: 42


# ------------------------------------------------------------
# Network simulation node
# ------------------------------------------------------------
network_sim:
  ros__parameters:

    # Update rate
    update_rate_hz: 10.0

    # Coverage area bounds
    # Fitted to the 29 damaged structures in worlds/earthquake_city.world
    # plus a 50 m importance margin, snapped to the 10 m cell size.
    # Generated: see disaster_scene.GRID_BOUNDS and
    # scripts/generate_disaster_scene.py. Do not hand-edit.
    area_x_min: -170.0
    area_x_max: 390.0
    area_y_min: -350.0
    area_y_max: 20.0

    # Grid resolution
    grid_resolution_m: 10.0

    # Hub drone ID
    hub_drone_id: 0

    # Ground user height
    ground_height_m: 0.0

    # Network routing model
    routing_strategy: "hub_leaf"


# ------------------------------------------------------------
# Coverage evaluation node
# ------------------------------------------------------------
coverage_calculator:
  ros__parameters:

    target_coverage_percent: 80.0

    # Minimum acceptable signal
    critical_signal_threshold_dbm: -75.0

    log_interval_sec: 5.0

    # coverage smoothing
    coverage_decay_rate: 0.02


# ------------------------------------------------------------
# Mesh visualizer node
# ------------------------------------------------------------
mesh_visualizer:
  ros__parameters:

    update_rate_hz: 5.0

    drone_marker_scale: 2.0
    link_line_width: 0.3

    show_signal_heatmap: true
    show_mesh_links: true