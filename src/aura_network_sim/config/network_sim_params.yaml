# ============================================================
# A.U.R.A. Network Simulation Configuration
# ============================================================

# ------------------------------------------------------------
# Global parameters shared by multiple nodes
# ------------------------------------------------------------
/**:
  ros__parameters:
    # Radio model
    tx_power_dbm: 20.0
    noise_floor_dbm: -100.0
    path_loss_exponent: 2.7
    reference_distance_m: 1.0

    # Mesh network limits
    max_mesh_distance_m: 150.0
    min_snr_db: 10.0

    # Simulation noise (useful for RL training)
    signal_noise_std_db: 2.0


# ------------------------------------------------------------
# Network simulation node
# ------------------------------------------------------------
network_sim:
  ros__parameters:

    # Update rate
    update_rate_hz: 10.0

    # Coverage area bounds
    area_x_min: -200.0
    area_x_max: 200.0
    area_y_min: -200.0
    area_y_max: 200.0

    # Grid resolution
    grid_resolution_m: 10.0

    # Hub drone ID
    hub_drone_id: 0

    # Ground user height
    ground_height_m: 0.0

    # Network routing model
    routing_strategy: "hub_leaf"


# ------------------------------------------------------------
# Coverage evaluation node
# ------------------------------------------------------------
coverage_calculator:
  ros__parameters:

    target_coverage_percent: 80.0

    # Minimum acceptable signal
    critical_signal_threshold_dbm: -75.0

    log_interval_sec: 5.0

    # coverage smoothing
    coverage_decay_rate: 0.02


# ------------------------------------------------------------
# Mesh visualizer node
# ------------------------------------------------------------
mesh_visualizer:
  ros__parameters:

    update_rate_hz: 5.0

    drone_marker_scale: 2.0
    link_line_width: 0.3

    show_signal_heatmap: true
    show_mesh_links: true