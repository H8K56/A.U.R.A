# ─────────────────────────────────────────────────
# A.U.R.A. Simulation Configuration
# ─────────────────────────────────────────────────
# Software-in-the-loop simulation parameters.
# Used by sim_no_px4.launch.py for full-stack testing
# without Gazebo or PX4 SITL.

/**:
  ros__parameters:

    # ── Swarm Driver ──────────────────────────────
    num_drones: 5
    publish_rate_hz: 10.0
    spawn_radius_m: 5.0           # Initial cluster radius
    spawn_altitude_m: 0.5         # Ground level start
    deploy_zone_x: 0.0              # Transit arrival zone = spawn area (drones hover here after takeoff)
    deploy_zone_y: 0.0
    deploy_zone_radius_m: 20.0      # Spawn radius is 5m so 20m is generous
    # Must match ActionConfig.world_center_* (120, -170): that is the centre
    # the checkpoint's 250 m clip disk is built around, and strategic_rl_node
    # warns when rl_target drifts from it because the policy would then be
    # clipped against a disk it never saw. This was (125, -164), 7.8 m off,
    # so the warning fired on every run and meant nothing.
    rl_target_x: 120.0
    rl_target_y: -170.0
    takeoff_altitude_m: 20.0
    max_speed_m_s: 5.0
    hub_drone_id: 0               # Drone 0 is the hub

    # ── Network Simulation ────────────────────────
    sim_rate_hz: 10.0
    grid_resolution_m: 10.0
    # Names must match what network_sim_node declares (area_x_min, not
    # area_min_x). They were transposed, so these bounds were silently
    # discarded and the node fell back to its own defaults — which happened to
    # be the same numbers, which is why it went unnoticed.
    #
    # Fitted to the disaster scene in worlds/earthquake_city.world: the
    # bounding box of all 29 damaged structures plus a 50 m margin (the
    # importance radius), snapped to the 10 m cell size. 56 x 37 cells.
    #
    # Do not hand-edit: these come from disaster_scene.GRID_BOUNDS, which
    # scripts/generate_disaster_scene.py derives from the world file.
    # test_grid_alignment.py asserts they still match.
    #
    # It was a 400 m box on the *origin*, which held 6 of the 29 structures
    # and excluded the whole eastern cluster, so coverage was reported over
    # mostly empty ground. The box is not square because the scene is not:
    # coverage % is a fraction of cells, so empty area dilutes it directly.
    area_x_min: -170.0
    area_y_min: -350.0
    area_x_max: 390.0
    area_y_max: 20.0
    tx_power_dbm: 20.0
    path_loss_exponent: 2.7
    coverage_threshold_dbm: -80.0
    max_mesh_distance_m: 150.0
    # Log-normal shadowing (roadmap §8). sigma in dB; see
    # network_sim_params.yaml for the ranges these values come from.
    signal_noise_std_db: 4.0
    shadow_correlation_distance_m: 25.0
    shadow_inter_link_correlation: 0.5
    shadowing_enabled: true
    random_seed: 42

    # ── Dead Zones ────────────────────────────────
    num_preset_zones: 0           # How many preset zones to load
    enable_moving_zones: false    # Dynamic zone movement
    zone_move_speed: 2.0          # m/s for moving zones

    # ── Mission Control ───────────────────────────
    tick_rate_hz: 2.0
    status_publish_rate_hz: 1.0
    auto_start: true              # Auto-start mission in sim mode
    min_battery_for_launch: 30.0  # Lower threshold for sim
    preflight_timeout_sec: 120.0   # Faster timeouts for sim
    takeoff_timeout_sec: 30.0
    transit_timeout_sec: 60.0
    formation_timeout_sec: 60.0
    operations_duration_sec: 300.0  # 5 min operations
    coverage_target: 70.0          # Slightly lower for sim
    critical_battery_percent: 15.0

    # ── Strategic RL ──────────────────────────────
    use_baseline: true            # Use baseline controller (no trained policy)
    baseline_type: 'grid'         # grid | spread | hho
    action_rate_hz: 2.0           # RL goal update rate — 2 Hz matches training dt=0.5s → 4 m/s transit

    # ── Scenario Runner ───────────────────────────
    auto_start_delay_sec: 5.0
    inject_dead_zone: false
    inject_at_ops_sec: 60.0       # Inject dead zone 60s into operations
