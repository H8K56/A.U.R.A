# MINCO Trajectory Optimizer Configuration
# A.U.R.A. Disaster Relief UAV Swarm

trajectory_planner:
  ros__parameters:
    # Drone identification
    drone_id: 0
    
    # Replanning rate
    replan_rate_hz: 10.0
    
    # Physical constraints
    max_velocity: 3.0          # m/s
    max_acceleration: 5.0      # m/s^2
    max_jerk: 20.0             # m/s^3
    
    # Safety clearances
    obstacle_clearance: 0.5    # meters
    swarm_clearance: 0.8       # meters
    
    # Optimization settings
    num_pieces: 8              # Number of polynomial pieces
    max_iterations: 100
    convergence_tolerance: 0.0001

swarm_coordinator:
  ros__parameters:
    num_drones: 5
    publish_rate_hz: 10.0
